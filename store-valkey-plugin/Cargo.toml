# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-store-valkey-plugin"
version = "1.0.0"
publish = false            # first-party store plugin cdylib, shipped as a packed/signed tarball, not to crates.io
edition = "2021"
rust-version = "1.97"
description = "The Valkey store as a droppable busbar plugin — a cdylib exporting the store C ABI. Drop it in the plugins folder and set store.module: valkey. One Valkey behind a fleet of busbar nodes means shared virtual keys, budgets, usage, and audit across the cluster."
license = "Apache-2.0"

[lib]
# cdylib: the DROPPED-IN door (a signed tarball in `plugins/`). `rlib` is REQUIRED for `cargo test` to
# emit the cdylib artifact AT ALL: with `cdylib` only, cargo builds a trivial "0 tests" harness for
# this package under `cargo test` and never produces the .dylib/.so, so the over-the-ABI tests find
# nothing.
crate-type = ["cdylib", "rlib"]

[dependencies]
# THE LOGIC, same repo. Its `export_store_plugin!(open)` registers the image's one door; this crate
# only makes that door a loadable library.
busbar-store-valkey = { path = "../store-valkey" }

[dev-dependencies]
# The conformance and end-to-end tests load the built cdylib over the REAL loader (sign, pack, scan,
# open) and the linked row through the same registry — dev-only, never in the shipped artifact. Same
# pinned rev as the logic crate's busbar-contract, so one busbar source resolves.
busbar-plugin-loader = { git = "https://github.com/GetBusbar/busbar", rev = "8b7b6473f47f8d37ae60839c74cfe6a9b64a1dc9" }
busbar-contract = { git = "https://github.com/GetBusbar/busbar", rev = "8b7b6473f47f8d37ae60839c74cfe6a9b64a1dc9" }
serde_json = "1"
# The typed rows the durability tests read back out of opaque plane-record bodies.
serde = { version = "1", features = ["derive"] }
# The real-admin-API e2e test drives an actual `busbar` process over HTTP (install a signed plugin
# tarball via POST /api/v1/admin/plugins, mint a key+credential via POST /admin/keys) — a blocking
# client keeps this test synchronous like the rest of the file. rustls-tls only.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# The real-admin-API e2e test's independent verification step reads the raw Valkey row bytes
# directly (bypassing busbar-store-valkey's own store impl too) — same version as the logic crate.
redis = { version = "1", default-features = false, features = ["tls-rustls"] }
# Base64-encodes the packed tarball into POST /api/v1/admin/plugins's JSON body.
base64 = "0.22"
