# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-store-valkey"
version = "1.0.0"
publish = false            # a first-party plugin crate; shipped linked into busbar or as a signed tarball
edition = "2021"
rust-version = "1.97"
description = "The Valkey backend for busbar's durable governance store — the shared, multi-node db plugin over a KV data model. Serves the store v3 door over the host's connector (no socket of its own): RESP2 over one connection per op."
license = "Apache-2.0"

[lib]
# rlib: THE LOGIC, and the store's door (`store_door!` over its `StoreSlots`: `door`, the row a
# busbar build that links this crate registers). The sibling `busbar-store-valkey-plugin` cdylib
# exports the same `door` as the dropped-in door. One source, both doors (DECISIONS #2 rule (1)).
crate-type = ["rlib"]

[dependencies]
# The ONE busbar crate a plugin names (#40: contract only; DECISIONS #84 merged the plugin SDK into it
# as `busbar_contract::abi::sdk`). Pinned by git rev to the busbar commit in `.busbar-ref`; a busbar
# build that links this crate `[patch]`es the busbar git source to its own tree, so ONE copy of the
# contract links.
busbar-contract = { workspace = true }
# NO RESP CLIENT AND NO TLS STACK: the store speaks RESP2 itself (`src/resp.rs`) over the HOST'S
# CONNECTOR (THE DESIGN, connections; ARCHITECT rulings 2026-10-03 on Q-L14-1 / Q-L16-2): every op is
# one connection the host dials, secures and wakes; the plugin image holds no socket.
serde_json = { workspace = true }
# `derive` for the plane-record sidecar and the v6 -> v7 migration's legacy row shapes.
serde = { workspace = true }

[dev-dependencies]
# The live tests open the store the way the host does: its door through the loader (`load_linked`,
# `LoadedStore`), over the loader's test connection table (`TcpConns`, `test-support`), with a
# runtime for the async `StoreCalls`. The upstream RESP client verifies what landed in Valkey
# INDEPENDENTLY of the store (tests only; never in the shipped image).
busbar-plugin-loader = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["rt"] }
redis = { workspace = true }
# The `RecordStore` contract conformance suite is this crate's own copy at
# `src/tests/store_conformance.rs` (#2/#31: no shared test util between plugins).
