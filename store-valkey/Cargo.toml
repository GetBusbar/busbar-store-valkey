# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-store-valkey"
version = "1.6.0"
publish.workspace = true  # a first-party plugin crate; shipped linked into busbar or as a signed tarball
edition.workspace = true
rust-version.workspace = true
description = "The Valkey backend for busbar's durable governance store — the shared, multi-node db plugin over a KV data model. Serves the primitive Store door over the host's connector (no socket of its own): RESP2 over up to eight kept connections, one per op in flight."
license.workspace = true

[lints]
workspace = true

[lib]
# rlib: The primitive backend and its native Store door (`door`, the row a
# busbar build that links this crate registers). The sibling `busbar-store-valkey-plugin` cdylib
# exports the same `door` as the dropped-in door. One source, both doors (DECISIONS #2 rule (1)).
crate-type = ["rlib"]

[dependencies]
getrandom = { workspace = true }
# The ONE busbar crate a plugin names (#40: contract only; DECISIONS #84 merged the plugin SDK into it
# as `busbar_contract::abi::sdk`). Pinned by git rev to the busbar commit in `.busbar-ref`; a busbar
# build that links this crate `[patch]`es the busbar git source to its own tree, so ONE copy of the
# contract links.
busbar-contract = { workspace = true }
# NO RESP CLIENT AND NO TLS STACK: the store speaks RESP2 itself (`src/resp.rs`) over the HOST'S
# CONNECTOR (THE DESIGN, connections; ARCHITECT rulings 2026-10-03 on Q-L14-1 / Q-L16-2): every op is
# one connection the host dials, secures and wakes; the plugin image holds no socket.
serde_json = { workspace = true }
# Serialization for settings and retained native bootstrap control.
serde = { workspace = true }
# The upstream driver's URL reading (1.5.5 parsed the store's URL with it): pure parsing, no socket.
url = { workspace = true }
zeroize = { workspace = true }
# Parser-only upstream source plus bounded strict-profile/byte-custody fixes;
# provenance and baseline hashes live beside the maintained dependency patch.
rdb-parser = { path = "../vendor/rdb-parser" }

[dev-dependencies]
# The live tests open the store the way the host does: its door through the loader (`load_linked`,
# `LoadedPersistence`), over the loader's test connection table with a
# runtime for asynchronous primitive calls. The upstream RESP client verifies what landed in Valkey
# INDEPENDENTLY of the store (tests only; never in the shipped image).
busbar-plugin-loader = { workspace = true }
busbar-core-connector = { workspace = true }
busbar-transport-tcp = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
redis = { workspace = true }
# The TLS proxy the TLS test puts in front of the live server (a self-signed CA), test-only.
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
rcgen = { workspace = true }
