# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-store-valkey"
version = "1.0.0"
publish = false            # a first-party plugin crate; shipped linked into busbar or as a signed tarball
edition = "2021"
rust-version = "1.97"
description = "The Valkey backend for busbar's durable governance store — the shared, multi-node db plugin over a KV data model. Implements busbar_contract::records::RecordStore on a mutex-guarded synchronous valkey connection."
license = "Apache-2.0"

[lib]
# rlib: THE LOGIC, and the store's door (`store_door!` over its `StoreSlots`: `door`, the row a
# busbar build that links this crate registers). The sibling `busbar-store-valkey-plugin` cdylib
# exports the same `door` as the dropped-in door. One source, both doors (DECISIONS #2 rule (1)).
crate-type = ["rlib"]

[dependencies]
# The ONE busbar crate a plugin names (#40: contract only; DECISIONS #84 merged the plugin SDK into it
# as `busbar_contract::abi::sdk`). Pinned by git rev to the busbar commit in `.busbar-ref`; a busbar
# build that links this crate `[patch]`es the busbar git source to its own tree, so ONE copy of the
# contract links.
busbar-contract = { workspace = true }
# The upstream RESP client, SYNCHRONOUS only (no async runtime), with rustls-backed TLS for
# rediss:// URLs. NOTE: this is the ONE name in this repo that is deliberately NOT "valkey" — it is
# an upstream crates.io package still published under its pre-fork name, so it is not ours to
# rename; the server it talks to is Valkey, and the RESP dialect is the same one Valkey speaks.
# Trimming default-features keeps the dependency tree small and license-clean and avoids pulling a
# second async stack into the plugin; the rustls backend reuses the single TLS stack busbar pins.
# `script` for the server-side atomic plane-record and usage-floor steps (EVAL).
redis = { workspace = true, features = ["tls-rustls"] }
# The rediss:// TLS path builds its rustls config against the PROCESS default crypto provider; this
# crate may live inside a plugin cdylib with its own rustls static state, so it installs the ring
# provider explicitly at connect. ring only — the same single provider busbar pins.
rustls = { workspace = true }
serde_json = { workspace = true }
# `derive` for the plane-record sidecar and the v6 -> v7 migration's legacy row shapes.
serde = { workspace = true }

# NO busbar dev-dependency. The `RecordStore` contract conformance suite used to arrive here as
# `busbar-plugin-testkit`; the owner ruled that crate DELETED on 2026-09-22 and #2/#31 forbid a shared
# test util between plugins, so this crate owns its copy at `src/tests/store_conformance.rs`.
