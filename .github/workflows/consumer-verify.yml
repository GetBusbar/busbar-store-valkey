# RENDERED by `cargo xtask fleet render busbar-store-valkey` from GetBusbar/busbar's plugins.yaml and
# .github/fleet/ templates; `cargo xtask fleet check` is red on any edit here. Daily: does the newest
# PUBLISHED release still work for a user (busbar's plugin-consumer-verify.yml)? A publish-time check
# cannot see an artifact that rots afterwards; release.yml verifies each release as it publishes.
name: consumer-verify

on:
  schedule:
    - cron: "24 9 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to verify. Empty = the newest published release."
        required: false
        type: string

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  consumer:
    uses: GetBusbar/busbar/.github/workflows/plugin-consumer-verify.yml@e1d3d8b097201859751d77208e66249d98b50a4b
    with:
      version: ${{ inputs.version || '' }}
      asset_prefix: busbar-store-valkey
      plugin_name: busbar-store-valkey
      plugin_alias: valkey
      plugin_kind: store
      bundle_image: ""
      bundle_env: ""
    secrets: inherit
