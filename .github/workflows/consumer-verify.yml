# RENDERED by `busbar-release plugin sync busbar-store-valkey` from GetBusbar/busbar-release template/; a hand
# edit is overwritten by the next sync. Daily: does the newest
# PUBLISHED release still work for a user (busbar's plugin-consumer-verify.yml)? A publish-time check
# cannot see an artifact that rots afterwards; release.yml verifies each release as it publishes.
name: consumer-verify

on:
  schedule:
    - cron: "24 9 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to verify. Empty = the newest published release."
        required: false
        type: string

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  consumer:
    uses: GetBusbar/busbar/.github/workflows/plugin-consumer-verify.yml@1c9e599003ad2b2789b271482824b52f390c3200
    with:
      version: ${{ inputs.version || '' }}
      asset_prefix: busbar-store-valkey
      plugin_name: busbar-store-valkey
      plugin_alias: valkey
      plugin_kind: store
      bundle_image: ""
      bundle_env: ""
    secrets: inherit
