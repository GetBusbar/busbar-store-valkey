# RENDERED by `cargo xtask fleet render busbar-store-valkey` from GetBusbar/busbar's plugins.yaml and
# .github/fleet/ templates; `cargo xtask fleet check` is red on any edit here. On a v* tag: this
# repo's CI on the tagged commit, then busbar's plugin-release.yml (build, sign, pack, publish), then
# the consumer verification of what was published, each at the busbar commit this repo pins.
name: release

on:
  push:
    # `vX.Y.Z-dev.N` is a signed PRE-RELEASE from dev (never main/qa); other suffixed tags start nothing.
    tags: ["v*", "!v*-*", "v*-dev.*"]
  # A tag pushed with GITHUB_TOKEN starts no workflow, so a workflow that tags dispatches this on
  # the tag ref (`gh workflow run release.yml --ref <tag>`).
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write
  attestations: write
  issues: write
  actions: read

jobs:
  ci:
    uses: GetBusbar/busbar/.github/workflows/plugin-ci.yml@e1d3d8b097201859751d77208e66249d98b50a4b
    with:
      service: valkey
      busbar_checkout: true
      macos_test: "cargo test --workspace --locked"
      extra_test: "cargo test -p busbar-store-valkey --locked -- --ignored --test-threads=1"
    secrets: inherit
  release:
    needs: ci
    uses: GetBusbar/busbar/.github/workflows/plugin-release.yml@e1d3d8b097201859751d77208e66249d98b50a4b
    with:
      plugin_crate: busbar-store-valkey-plugin
      manifest_name: busbar-store-valkey
      plugin_alias: valkey
      plugin_kind: store
      asset_prefix: busbar-store-valkey
      description: "The Valkey store as a droppable busbar plugin: a cdylib exporting the store C ABI. Drop it in the plugins folder and set store.module: valkey. One Valkey behind a fleet of busbar nodes means shared virtual keys, budgets, usage, and audit across the cluster."
      lib_only: false
      needs_prompt: ""
      needs_user: ""
      declares_file: "store-valkey/declares.json"
    secrets: inherit
  consumer-verify:
    needs: release
    if: ${{ !cancelled() }}
    uses: GetBusbar/busbar/.github/workflows/plugin-consumer-verify.yml@e1d3d8b097201859751d77208e66249d98b50a4b
    with:
      version: ${{ github.ref_name }}
      asset_prefix: busbar-store-valkey
      plugin_name: busbar-store-valkey
      plugin_alias: valkey
      plugin_kind: store
      bundle_image: ""
      bundle_env: ""
    secrets: inherit
