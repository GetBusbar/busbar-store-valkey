# store-valkey CI — fmt, clippy, build, the store's own suite against a live Valkey, the linked +
# dropped-in conformance, and the real-busbar end-to-end install, all against the busbar rev this
# repo PINS.
#
# This repo builds standalone: its only busbar dependency (busbar-contract, and busbar-plugin-loader
# for the conformance and end-to-end tests) is a `git` dependency on https://github.com/GetBusbar/busbar
# at the rev in field 1 of `.busbar-ref`. No path dependency — so what CI proves is exactly what a
# busbar build that pulls this repo at a pinned rev links. The end-to-end tests drive a REAL `busbar`
# binary; CI checks GetBusbar/busbar out at that SAME rev beside this repo and points
# `BUSBAR_CHECKOUT` at it.
#
# LIVE VALKEY, NEVER SKIPPED: under `CI` the store's live tests FAIL without `VALKEY_URL` (they never
# skip), so both legs start a real server — a `valkey/valkey` service container on Linux, a
# brew-installed `valkey-server` on macOS (GitHub runs service containers on Linux only).
name: ci

on:
  push:
    branches: [main, dev, qa]
  pull_request:
    branches: [main, dev, qa]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # No global RUSTFLAGS: it would also reach the nested real-busbar build (whose warning posture is
  # busbar's) and change its fingerprint. `clippy -D warnings` holds this repo's code to zero warnings.
  # The real `busbar` the end-to-end tests boot is built in release; LTO off and more codegen units
  # keep that build inside the job budget. Behaviour is unchanged (a release profile knob, not a
  # feature).
  CARGO_PROFILE_RELEASE_LTO: "off"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  pin:
    name: the busbar pin is one rev
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rev: ${{ steps.pin.outputs.rev }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Every `rev = "..."` on the busbar git source in every manifest is field 1 of `.busbar-ref`.
      # Two revs would link two copies of the contract; a rev that disagrees with `.busbar-ref` makes
      # the pin a lie about what the release builds against.
      - name: every busbar git dependency names the .busbar-ref rev
        id: pin
        run: |
          set -euo pipefail
          pin=$(awk '{print $1; exit}' .busbar-ref)
          [[ "$pin" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::.busbar-ref field 1 is not a full sha: '$pin'"; exit 1; }
          found=$(grep -hoE 'git = "https://github.com/GetBusbar/busbar", rev = "[0-9a-f]+"' */Cargo.toml | grep -oE '[0-9a-f]{40}' | sort -u)
          [ -n "$found" ] || { echo "::error::no busbar git dependency found"; exit 1; }
          if [ "$found" != "$pin" ]; then
            echo "::error::busbar revs in manifests ($found) != .busbar-ref ($pin)"; exit 1
          fi
          if grep -nE 'path = "\.\./\.\./' */Cargo.toml; then
            echo "::error::a manifest names a sibling-checkout path dependency"; exit 1
          fi
          if grep -nE 'busbar-(api|plugin-sdk|plugin-testkit)' */Cargo.toml; then
            echo "::error::a manifest names a retired busbar crate (#40: busbar-contract only)"; exit 1
          fi
          echo "pinned busbar rev: $pin"
          echo "rev=$pin" >> "$GITHUB_OUTPUT"

  linux:
    name: fmt, clippy, build, test, conformance, e2e [ubuntu-latest]
    needs: pin
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      valkey:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      VALKEY_URL: redis://127.0.0.1:6379/0
      BUSBAR_CHECKOUT: ${{ github.workspace }}/busbar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: plugin
      - name: Checkout busbar at the pinned rev (the real binary the end-to-end tests boot)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: GetBusbar/busbar
          ref: ${{ needs.pin.outputs.rev }}
          path: busbar
      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            plugin
            busbar
          key: busbar-${{ needs.pin.outputs.rev }}
      - name: fmt
        working-directory: plugin
        run: cargo fmt --all -- --check
      - name: clippy
        working-directory: plugin
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: build (the rlib a busbar build links, and the cdylib a signed tarball carries)
        working-directory: plugin
        run: cargo build --workspace --locked
      - name: build the real busbar + busbar-plugin-pack at the pin
        working-directory: busbar
        run: |
          cargo build --release --locked -p busbar --bin busbar
          cargo build --release --locked -p busbar-plugin-loader --features pack --bin busbar-plugin-pack
      - name: test (the store's suite, the both-doors conformance, the end-to-end install)
        working-directory: plugin
        run: cargo test --workspace --locked
      # These mutate server-wide state (CONFIG SET, a namespace wipe), so they run alone, last.
      - name: test (the exclusive, server-wide cases)
        working-directory: plugin
        run: cargo test -p busbar-store-valkey --locked -- --ignored --test-threads=1

  macos:
    name: fmt, clippy, build, test, conformance, e2e [macos-latest]
    needs: pin
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      VALKEY_URL: redis://127.0.0.1:6379/0
      BUSBAR_CHECKOUT: ${{ github.workspace }}/busbar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: plugin
      - name: Checkout busbar at the pinned rev (the real binary the end-to-end tests boot)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: GetBusbar/busbar
          ref: ${{ needs.pin.outputs.rev }}
          path: busbar
      - name: Start a live Valkey (no service containers on macOS)
        run: |
          set -euo pipefail
          brew install valkey
          valkey-server --port 6379 --bind 127.0.0.1 --daemonize yes --save "" --appendonly no \
            --maxmemory-policy noeviction
          for _ in $(seq 1 30); do valkey-cli -p 6379 ping && exit 0; sleep 1; done
          echo "::error::valkey did not come up"; exit 1
      - uses: dtolnay/rust-toolchain@62ae3a85dbdd2bedbb5819da8ce45635129289a1 # 1.98.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            plugin
            busbar
          key: busbar-${{ needs.pin.outputs.rev }}
      - name: clippy
        working-directory: plugin
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: build
        working-directory: plugin
        run: cargo build --workspace --locked
      - name: build the real busbar + busbar-plugin-pack at the pin
        working-directory: busbar
        run: |
          cargo build --release --locked -p busbar --bin busbar
          cargo build --release --locked -p busbar-plugin-loader --features pack --bin busbar-plugin-pack
      - name: test (the store's suite, the both-doors conformance, the end-to-end install)
        working-directory: plugin
        run: cargo test --workspace --locked
      - name: test (the exclusive, server-wide cases)
        working-directory: plugin
        run: cargo test -p busbar-store-valkey --locked -- --ignored --test-threads=1
